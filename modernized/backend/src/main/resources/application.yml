server:
  port: 8080

spring:
  application:
    name: carddemo-backend
  datasource:
    url: jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

carddemo:
  page-size:
    cards: 7
    transactions: 10
    users: 10
